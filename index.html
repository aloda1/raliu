<!doctype html>
<html lang="ro">
<head>
<base href="./">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#073d36">
<title>raliu • turneu de ping-pong
</title>
<script src="./theme.js?v=header-theme-v1"></script>
<link rel="stylesheet" href="./styles.css?v=dd802bcb1870">
</head>
<body>
<header>
<div class="inner">
<div class="header-top">
<div class="brand"><span class="logo">◉</span> raliu
</div>
<button type="button" id="quick-winner" class="theme-toggle odds-switch" role="switch" aria-checked="false" title="permite alegerea câștigătorului fără scor">quick winner <span class="odds-track" aria-hidden="true"></span></button>
<div class="theme-control" id="theme-control">
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="schimbă tema" aria-expanded="false" aria-controls="theme-menu">
<svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
<svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13.4A9 9 0 0 1 10.6 3.1 9 9 0 1 0 20.9 13.4Z"/></svg>
<svg class="theme-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
</button>
<div class="theme-menu" id="theme-menu" role="group" aria-label="temă" hidden>
<button type="button" data-theme-value="system" aria-pressed="false">sistem</button>
<button type="button" data-theme-value="light" aria-pressed="false">luminoasă</button>
<button type="button" data-theme-value="dark" aria-pressed="false">întunecată</button>
</div>
</div>
</div>
<div class="hero">
<div>
<small>tenis de masă / eliminare directă
</small>
<h1>turneu de<br>ping-pong.
</h1>
</div>
<svg class="court" viewBox="0 0 150 120" aria-hidden="true"><g transform="rotate(-12 75 60)" stroke="#cbf865" fill="none" stroke-width="3"><rect x="12" y="23" width="126" height="75" rx="3"/><path d="M12 61h126M75 16v89"/><path stroke-dasharray="5 6" d="m32 77 66-39"/></g><circle cx="104" cy="30" r="9" fill="#ffab73"/>
</svg>
</div>
</div>
</header>
<main>
<nav class="tabs">
<a id="tt" href="./" class="primary">turneu
</a>
<a id="te" href="./elo/">elo
</a>
<a id="th" href="./history/">istoric
</a>
</nav>
<div id="tour">
<section id="setup">
<small>01 / înscrieri
</small>
<h2>cine joacă?
</h2>
<label for="names">scrie câte un nume pe fiecare rând.
</label>
<textarea id="names" rows="6">
</textarea>
<div>
<label for="target">primul la câte puncte?</label>
<input id="target" type="number" min="2" step="1" value="11" required inputmode="numeric">
<label for="adv">avansează din fiecare grupă: 
</label>
<select id="adv">
<option value="2">primii 2
</option>
<option value="1">doar primul
</option>
</select>
</div>
<div class="row"><span id="count"></span>
<button class="primary" id="start">amestecă și începe ↗
</button>
</div>
<div role="alert" id="error" class="error">
</div>
</section>
<div id="board">
</div>
</div>
<div id="eloview" hidden>
</div>
<div id="historyview" hidden>
</div>
<section id="bk" hidden>
<small>backup
</small>
<h2>copie de siguranță
</h2><p>salvează turneul și elo-ul într-un fișier sau restaurează dintr-un fișier.</p>
<div class="row">
<button id="bx">descarcă backup
</button>
<button id="bi">restaurează din fișier…
</button>
</div>
<input type="file" id="bf" accept="application/json,.json" hidden>
<div id="bm" role="alert">
</div>
</section>

</main>
<div id="sync" role="status">
</div>
<dialog id="admin-login">
<form id="admin-form">
<h2>acces administrator</h2>
<label>email<input id="admin-email" type="email" required autocomplete="username"></label>
<label>parolă<input id="admin-password" type="password" required autocomplete="current-password"></label>
<p role="alert" id="admin-error"></p>
<button type="button" id="admin-cancel">anulează</button>
<button type="submit" class="primary">confirmă</button>
</form>
</dialog>
<script src="./events.js?v=56e7cd4c0ce4"></script>
<script src="./firebase.js?v=ea072a018f28"></script>
<script src="./history.js?v=inline-results-v1"></script>
<script src="./odds.js?v=deuce-score-v2"></script>
<script src="./elo.js?v=53e97d5ca2eb"></script>
<script src="./forecast.js?v=b0049be2f604"></script>
<script src="./tournament.js?v=164f5c9fd829"></script>
<script src="./match.js?v=a82109e33a1f"></script>
<script src="./backup.js?v=d22f48eb4b1d"></script>
<script src="./app.js?v=e5a5c31de1c6"></script>
</body>
</html>
